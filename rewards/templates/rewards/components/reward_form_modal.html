{# Modal tambah / ubah hadiah. Dipakai oleh reward_list.html (khusus petugas). #}
<dialog id="reward-modal" class="rw-modal" aria-labelledby="reward-modal-title">
  <form method="post" id="reward-form" class="rw-modal-form"
        action="{% url 'rewards:reward_create' %}"
        data-create-action="{% url 'rewards:reward_create' %}">
    {% csrf_token %}

    <header class="rw-modal-head">
      <h2 id="reward-modal-title" class="rw-modal-title">Tambah hadiah</h2>
      <button type="button" class="rw-modal-close" data-modal-close aria-label="Tutup">&times;</button>
    </header>

    <div class="rw-modal-body">
      {% for field in form %}
        <div class="rw-field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}
            <p class="rw-field-error">{{ error }}</p>
          {% endfor %}
        </div>
      {% endfor %}
    </div>

    <footer class="rw-modal-foot">
      <button type="button" class="rw-btn rw-btn-ghost" data-modal-close>Batal</button>
      <button type="submit" class="rw-btn rw-btn-primary">Simpan</button>
    </footer>
  </form>
</dialog>

<script>
  (function () {
    const modal = document.getElementById('reward-modal');
    if (!modal) return;

    const form = document.getElementById('reward-form');
    const title = document.getElementById('reward-modal-title');
    const createAction = form.dataset.createAction;

    function setField(id, value) {
      const el = document.getElementById(id);
      if (el) el.value = value || '';
    }

    function openCreate() {
      form.reset();
      form.action = createAction;
      title.textContent = 'Tambah hadiah';
      modal.showModal();
    }

    function openEdit(btn) {
      form.reset();
      form.action = btn.dataset.action;
      title.textContent = 'Ubah hadiah';
      setField('id_nama', btn.dataset.nama);
      setField('id_deskripsi', btn.dataset.deskripsi);
      setField('id_kategori', btn.dataset.kategori);
      setField('id_harga_poin', btn.dataset.harga);
      setField('id_stok', btn.dataset.stok);
      setField('id_gambar', btn.dataset.gambar);
      modal.showModal();
    }

    document.querySelectorAll('[data-modal-open="create"]')
      .forEach(btn => btn.addEventListener('click', openCreate));

    document.querySelectorAll('.js-edit-reward')
      .forEach(btn => btn.addEventListener('click', () => openEdit(btn)));

    document.querySelectorAll('[data-modal-close]')
      .forEach(btn => btn.addEventListener('click', () => modal.close()));

    // klik area gelap di luar kotak = tutup
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.close();
    });
  })();
</script>
