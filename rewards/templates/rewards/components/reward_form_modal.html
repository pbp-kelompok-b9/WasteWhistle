{# Modal tambah / ubah hadiah #}
<dialog id="reward-modal" class="rw-modal" aria-labelledby="reward-modal-title">
  <form method="post" id="reward-form" class="rw-modal-form"
        data-create-url="{% url 'rewards:create_reward_ajax' %}"
        data-update-url="{% url 'rewards:update_reward_ajax' 0 %}">
    {% csrf_token %}

    <header class="rw-modal-head">
      <h2 id="reward-modal-title" class="rw-modal-title">Tambah hadiah</h2>
      <button type="button" class="rw-modal-close" data-modal-close aria-label="Tutup">&times;</button>
    </header>

    <div class="rw-modal-body">
      {% for field in form %}
        <div class="rw-field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
        </div>
      {% endfor %}
    </div>

    <footer class="rw-modal-foot">
      <button type="button" class="rw-btn rw-btn-ghost" data-modal-close>Batal</button>
      <button type="submit" class="rw-btn rw-btn-primary">Simpan</button>
    </footer>
  </form>
</dialog>

<script>
(function () {
  const modal = document.getElementById('reward-modal');
  if (!modal) return;

  const form = document.getElementById('reward-form');
  const title = document.getElementById('reward-modal-title');
  const submitButton = form.querySelector('button[type="submit"]');
  const CREATE_URL = form.dataset.createUrl;
  const UPDATE_URL = form.dataset.updateUrl;   // berisi angka 0 sebagai penanda id

  let editingId = null;   // null = mode tambah, selain itu = id hadiah yang diubah

  function setField(id, value) {
    const el = document.getElementById(id);
    if (el) el.value = (value === null || value === undefined) ? '' : value;
  }

  function clearErrors() {
    form.querySelectorAll('.rw-field-error').forEach(function (el) { el.remove(); });
  }

  function showFieldErrors(errors) {
    Object.entries(errors).forEach(function (entry) {
      const name = entry[0];
      const list = entry[1];
      const input = form.querySelector('[name="' + name + '"]');
      const wrapper = input ? input.closest('.rw-field') : null;
      if (!wrapper) return;
      const p = document.createElement('p');
      p.className = 'rw-field-error';
      p.textContent = list.map(function (e) { return e.message; }).join(' ');
      wrapper.appendChild(p);
    });
  }

  function openCreate() {
    form.reset();
    clearErrors();
    editingId = null;
    title.textContent = 'Tambah hadiah';
    modal.showModal();
  }

  function openEdit(id, reward) {
    if (!reward) return;
    form.reset();
    clearErrors();
    editingId = id;
    title.textContent = 'Ubah hadiah';
    setField('id_nama', reward.nama);
    setField('id_deskripsi', reward.deskripsi);
    setField('id_kategori', reward.kategori);
    setField('id_harga_poin', reward.harga_poin);
    setField('id_stok', reward.stok);
    setField('id_gambar', reward.gambar);
    modal.showModal();
  }

  async function submitForm(event) {
    event.preventDefault();
    clearErrors();
    submitButton.disabled = true;

    const url = editingId ? UPDATE_URL.replace('/0/', '/' + editingId + '/') : CREATE_URL;

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'X-CSRFToken': window.CSRF_TOKEN, 'Accept': 'application/json' },
        body: new FormData(form),
      });
      const result = await response.json().catch(function () { return {}; });

      if (response.ok) {
        modal.close();
        window.showToast(result.message || 'Hadiah tersimpan.', 'success');
        document.dispatchEvent(new CustomEvent('rewards:changed'));
      } else {
        if (result.errors) showFieldErrors(result.errors);
        window.showToast(
          result.message || (result.errors ? 'Periksa kembali isian form.' : 'Terjadi kesalahan (status ' + response.status + ').'),
          'error'
        );
      }
    } catch (error) {
      console.error('Error saving reward:', error);
      window.showToast('Tidak dapat terhubung ke server. Silakan coba lagi.', 'error');
    } finally {
      submitButton.disabled = false;
    }
  }

  form.addEventListener('submit', submitForm);

  modal.querySelectorAll('[data-modal-close]').forEach(function (btn) {
    btn.addEventListener('click', function () { modal.close(); });
  });

  // klik area gelap di luar kotak = tutup
  modal.addEventListener('click', function (e) { if (e.target === modal) modal.close(); });

  // dipanggil oleh reward_list.html
  window.rewardModal = { openCreate: openCreate, openEdit: openEdit };
})();
</script>
