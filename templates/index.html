{% extends 'base.html' %}

{% block meta %}
    <title>Sign in - Waste Whistle</title>
{% endblock meta %}

{% block content %}
<main class="page-container">
    <div class="card">
        <h1 class="card-title">Sign in</h1>
        <p class="card-subtitle">Sign in to report waste, claim tasks and redeem rewards.</p>

        <div class="pill-tabs">
            <button type="button" class="pill-btn active">Sign in</button>
            <button type="button" class="pill-btn">Create account</button>
        </div>

        <form class="auth-form">
            <div class="form-group">
                <label for="username">Username or email</label>
                <input type="text" id="username" placeholder="ranger@example.com" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" />
            </div>

            <button type="submit" class="submit-btn">Sign in</button>
        </form>

        <a href="#" class="forgot-link">Forgot your password?</a>
    </div>
</main>
{% endblock content %}
