{% extends 'base.html' %}

{% block meta %}
    <title>Login - Waste Whistle</title>
{% endblock meta %}

{% block content %}
<main class="page-container">
    <div class="card">
        <h1 class="card-title">Login</h1>
        <p class="card-subtitle">Log in to report waste, claim tasks and redeem rewards.</p>

        <form class="auth-form">
            <div class="form-group">
                <label for="username">Username or email</label>
                <input type="text" id="username" placeholder="ranger@example.com" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" />
            </div>

            <button type="submit" class="submit-btn">Sign in</button>
        </form>

        <div class="auth-links">
            <a href="#" class="forgot-link">Forgot your password?</a>
            <p class="form-footer-note">Don't have an account? <a href="{% url 'landing_page' %}" class="forgot-link">Sign up</a></p>
        </div>
    </div>
</main>
{% endblock content %}
