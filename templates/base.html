{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=tailwind-3.4.17-20261026">
    {% block meta %}{% endblock meta %}
</head>
<body>
    {% block body %}
        <header class="p-6">
            <div class="brand">
                <a href="{% url 'register_user' %}" class="no-underline text-inherit">Waste Whistle</a>
            </div>
        </header>

        {% block content %}{% endblock %}

        <footer class="footer">
            <div class="footer-inner text-center justify-center">
                <p>&copy; 2026 Waste Whistle</p>
            </div>
        </footer>
    {% endblock body %}
</body>
</html>
