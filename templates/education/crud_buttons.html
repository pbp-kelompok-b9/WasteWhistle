<div class="education-crud-buttons" aria-label="Kelola section {{ kind }}">
    <button type="button" class="education-crud-button" aria-label="Tambah item"
        title="Tambah" hx-get="{% url 'education_create_form' kind %}"
        hx-target="#education-modal-content" hx-swap="innerHTML">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button type="button" class="education-crud-button" aria-label="Edit item"
        title="Edit" hx-get="{% url 'education_item_picker' kind %}?action=edit"
        hx-target="#education-modal-content" hx-swap="innerHTML">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
    </button>
    <button type="button" class="education-crud-button education-crud-button--delete" aria-label="Hapus item"
        title="Hapus" hx-get="{% url 'education_item_picker' kind %}?action=delete"
        hx-target="#education-modal-content" hx-swap="innerHTML">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg>
    </button>
</div>
