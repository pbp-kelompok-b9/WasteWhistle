<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Circle (Solid Deep Forest Green) -->
  <circle cx="256" cy="256" r="236" fill="#0C4A35" />

  <!-- Outer Eco Accent Ring (Solid Medium Green) -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#11734F" stroke-width="12" />

  <!-- Inner Dashed Eco Orbit (Solid Light Mint Accent) -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#34C486" stroke-width="6" opacity="0.4" stroke-dasharray="16 12" />

  <!-- Centered Classic Whistle Group (No Sound Waves/Effects) -->
  <g transform="translate(48, 44) scale(0.81)">

    <!-- Whistle Lanyard Ring (Left Side) -->
    <path d="M 125 275 C 125 242, 92 242, 92 275 C 92 308, 125 308, 125 275 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" />

    <!-- Main Whistle Body (Solid White) -->
    <path d="M 190 205
             C 135 205, 110 242, 110 282
             C 110 335, 145 358, 190 358
             L 345 358
             C 364 358, 376 344, 376 325
             L 376 258
             C 376 239, 364 225, 345 225
             L 242 225
             C 224 205, 206 205, 190 205 Z" 
          fill="#FFFFFF" />

    <!-- Whistle Sound Slot / Cutout (Solid Dark Green) -->
    <rect x="238" y="225" width="38" height="32" rx="6" fill="#062C1E" />

    <!-- Inner Chamber Mint Ball Accent (Solid Bright Mint) -->
    <circle cx="178" cy="282" r="30" fill="#34C486" />

    <!-- Mouthpiece Tip (Solid Soft Light Green) -->
    <path d="M 370 248 L 388 242 C 395 242, 400 247, 400 254 L 400 328 C 400 335, 395 340, 388 340 L 370 334 Z" fill="#DCF3E4" />

    <!-- Sprouting Eco Leaves -->
    <g transform="translate(257, 222)">
      <!-- Right Leaf (Solid Bright Mint) -->
      <path d="M 0 0 C 35 -60, 110 -65, 105 -5 C 100 50, 30 30, 0 0 Z" fill="#34C486" />
      <!-- Left Leaf (Solid Medium Green) -->
      <path d="M 0 0 C -30 -52, -100 -40, -88 8 C -76 50, -18 25, 0 0 Z" fill="#11734F" />
      <!-- Leaf Veins (Solid White) -->
      <path d="M 0 0 Q 40 -25, 70 -15" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 0 0 Q -30 -18, -52 -6" fill="none" stroke="#FFFFFF" stroke-width="3.5" opacity="0.8" stroke-linecap="round" />
    </g>

  </g>
</svg>
